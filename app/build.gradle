apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

if(rootProject.file("keystore.properties").exists()) {
    // From https://developer.android.com/studio/publish/app-signing.html
    // to load the signing config file
    def keystorePropertiesFile = rootProject.file("keystore.properties")
    def keystoreProperties = new Properties()
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))

    android {
        signingConfigs {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
        buildTypes {
            release {
                signingConfig signingConfigs.release
            }
        }
   }
}

def sourceSha = (project.findProperty('SOURCE_SHA') ?: System.getenv('SOURCE_SHA') ?: '').toString()
if (!sourceSha) {
    def output = new ByteArrayOutputStream()
    exec { commandLine 'git', 'rev-parse', 'HEAD'; standardOutput = output }
    sourceSha = output.toString().trim()
}
if (!(sourceSha ==~ /[0-9a-f]{40}/)) throw new GradleException('SOURCE_SHA must be a full immutable commit')
def buildIdentity = (System.getenv('GITHUB_RUN_ID') ?: 'local') + '-' + (System.getenv('GITHUB_RUN_ATTEMPT') ?: '1')

android {
    compileSdkVersion 32

    defaultConfig {
        applicationId "com.cbkii.redmoontv"
        minSdkVersion 26
        targetSdkVersion 32
        versionCode = (project.findProperty('VERSION_CODE') ?: '40').toString().toInteger()
        versionName = (project.findProperty('VERSION_NAME') ?: '4.0.1-tv.1').toString()
        manifestPlaceholders = [appLabel: 'Red Moon TV']
        buildConfigField 'String', 'SOURCE_SHA', '"' + sourceSha + '"'
        buildConfigField 'String', 'BUILD_ID', '"' + buildIdentity + '"'
        buildConfigField 'String', 'BACKEND_PROTOCOL', '"apk-jni-v4/root-pipe-v1"'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }

        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            manifestPlaceholders = [appLabel: 'Red Moon TV DEBUG']
        }
        create('snapshot') {
            initWith release
            applicationIdSuffix '.testing'
            versionNameSuffix ''
            signingConfig null
            manifestPlaceholders = [appLabel: 'Red Moon TV TESTING']
            matchingFallbacks = ['release']
        }
    }
    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
    lint {
        disable 'NewApi', 'ExpiredTargetSdkVersion'
    }
}

dependencies {
    implementation platform("org.jetbrains.kotlin:kotlin-bom:$kotlin_version")
    testImplementation 'junit:junit:4.13.2'
    // Android/platform deps
    implementation 'androidx.core:core:1.7.0'
    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.3'
    implementation 'androidx.preference:preference:1.2.0'
    implementation 'androidx.preference:preference-ktx:1.2.0'
    implementation 'com.google.android.material:material:1.5.0'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"

    // Written by me
    implementation project(":timepickerpreference")

    // 3rd party
    implementation 'com.luckycatlabs:SunriseSunsetCalculator:1.2'
    implementation 'com.github.paolorotolo:appintro:4.1.0'
    implementation 'org.greenrobot:eventbus:3.2.0'
    implementation 'com.github.topjohnwu.libsu:core:3.1.1'
    // annotationProcessor 'org.greenrobot:eventbus-annotation-processor:3.0.1'

}

repositories {
    mavenCentral()
}
