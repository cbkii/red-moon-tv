apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

if(rootProject.file("keystore.properties").exists()) {
    // From https://developer.android.com/studio/publish/app-signing.html
    // to load the signing config file
    def keystorePropertiesFile = rootProject.file("keystore.properties")
    def keystoreProperties = new Properties()
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))

    android {
        signingConfigs {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
        buildTypes {
            release {
                signingConfig signingConfigs.release
            }
        }
   }
}

android {
    compileSdkVersion 32

    defaultConfig {
        applicationId "com.cbkii.redmoontv"
        minSdkVersion 26
        targetSdkVersion 32
        versionCode (project.findProperty('VERSION_CODE') ?: '40').toInteger()
        versionName project.findProperty('VERSION_NAME') ?: '4.0.1-tv.1'
        manifestPlaceholders = [appLabel: 'Red Moon TV']
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }

        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            manifestPlaceholders = [appLabel: 'Red Moon TV DEBUG']
        }
        testing {
            initWith release
            applicationIdSuffix '.testing'
            versionNameSuffix ''
            signingConfig null
            manifestPlaceholders = [appLabel: 'Red Moon TV TESTING']
            matchingFallbacks = ['release']
        }
    }
    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
    lint {
        disable 'NewApi', 'ExpiredTargetSdkVersion'
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    // Android/platform deps
    implementation 'androidx.core:core:1.7.0'
    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.3'
    implementation 'androidx.preference:preference:1.2.0'
    implementation 'androidx.preference:preference-ktx:1.2.0'
    implementation 'com.google.android.material:material:1.5.0'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"

    // Written by me
    implementation project(":timepickerpreference")

    // 3rd party
    implementation 'com.luckycatlabs:SunriseSunsetCalculator:1.2'
    implementation 'com.github.paolorotolo:appintro:4.1.0'
    implementation 'org.greenrobot:eventbus:3.2.0'
    implementation 'com.github.topjohnwu.libsu:core:3.1.1'
    // annotationProcessor 'org.greenrobot:eventbus-annotation-processor:3.0.1'

}

repositories {
    mavenCentral()
}
